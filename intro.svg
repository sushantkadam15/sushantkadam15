<svg xmlns="http://www.w3.org/2000/svg" width="550" height="400" viewBox="0 0 550 400" fill="none">
<title>Sushant’s introduction</title>
<style>.bubble { fill: #e9e9eb; }
text { fill: #242424; font-size: 18px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; letter-spacing: -0.02em; }
.dots { fill: #999999; }
@keyframes hidden { from, to { opacity: 0; } }
@keyframes typing { 0%,100% { opacity: 0; } 17%,86% { opacity: 1; } }
.typing-1 { opacity: 0; animation: hidden 0.00s, typing 0.94s 0.00s; }
.msg-1 { animation: hidden 0.94s, pop-1 .24s 0.94s forwards; }
@keyframes pop-1 { 0% { opacity: 0; transform: translate(10px, 5px); } 100% { opacity: 1; transform: translate(10px, 0px); } }
.typing-2 { opacity: 0; animation: hidden 1.32s, typing 2.06s 1.32s; }
.msg-2 { animation: hidden 3.38s, pop-2 .24s 3.38s forwards; }
@keyframes pop-2 { 0% { opacity: 0; transform: translate(10px, 59px); } 100% { opacity: 1; transform: translate(10px, 54px); } }
.typing-3 { opacity: 0; animation: hidden 3.76s, typing 2.40s 3.76s; }
.msg-3 { animation: hidden 6.16s, pop-3 .24s 6.16s forwards; }
@keyframes pop-3 { 0% { opacity: 0; transform: translate(10px, 137px); } 100% { opacity: 1; transform: translate(10px, 132px); } }
.typing-4 { opacity: 0; animation: hidden 6.54s, typing 2.12s 6.54s; }
.msg-4 { animation: hidden 8.66s, pop-4 .24s 8.66s forwards; }
@keyframes pop-4 { 0% { opacity: 0; transform: translate(10px, 215px); } 100% { opacity: 1; transform: translate(10px, 210px); } }
.typing-5 { opacity: 0; animation: hidden 9.04s, typing 0.72s 9.04s; }
.msg-5 { animation: hidden 9.77s, pop-5 .24s 9.77s forwards; }
@keyframes pop-5 { 0% { opacity: 0; transform: translate(10px, 293px); } 100% { opacity: 1; transform: translate(10px, 288px); } }
.typing-6 { opacity: 0; animation: hidden 10.15s, typing 1.34s 10.15s; }
.msg-6 { animation: hidden 11.49s, pop-6 .24s 11.49s forwards; }
@keyframes pop-6 { 0% { opacity: 0; transform: translate(10px, 347px); } 100% { opacity: 1; transform: translate(10px, 342px); } }
@media (prefers-color-scheme: dark) { .bubble { fill: #3b3b3d; } text { fill: #dcdcdc; } }
@media (prefers-reduced-motion: reduce) { g[class^='msg-'] { animation: none; opacity: 1; } g[class^='typing-'] { display: none; } }</style>
<g transform="translate(10, 0)" class="typing-1">
<rect x="8.27246" width="69.7276" height="42" rx="20.9774" class="bubble" />
<circle cx="13.591" cy="33.091" r="7.68185" class="bubble" />
<circle cx="3.54547" cy="41.9547" r="3.54547" class="bubble" />
<circle cx="27.4778" cy="20.9773" r="5.02275" class="dots"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.0s" repeatCount="indefinite" /></circle>
<circle cx="42.8411" cy="20.9773" r="5.02275" class="dots"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.2s" repeatCount="indefinite" /></circle>
<circle cx="58.2054" cy="20.9773" r="5.02275" class="dots"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.4s" repeatCount="indefinite" /></circle>
</g>
<g transform="translate(10, 0)" class="msg-1">
<rect width="390" height="42" rx="18" class="bubble" />
<text x="15" y="27">Happy Saturday! 👋 I&#x27;m Sushant.</text>
</g>
