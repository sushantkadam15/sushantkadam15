<circle cx="58.2054" cy="20.9773" r="5.02275" class="dots"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.4s" repeatCount="indefinite" /></circle>
</g>
<g transform="translate(10, 132)" class="msg-3">
