<svg xmlns="http://www.w3.org/2000/svg" width="550" height="436" viewBox="0 0 550 436" fill="none">
<title>Sushant’s introduction</title>
<style>.bubble { fill: #e9e9eb; }
text { fill: #242424; font-size: 18px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; letter-spacing: -0.02em; }
.dots { fill: #999999; }
@keyframes wait { 0%, 100% { opacity: 0; } }
@keyframes fade-in-out { 0%, 100% { opacity: 0; } 25%, 90% { opacity: 1; } }
.typing-1 { opacity: 0; animation: wait 0.00s, fade-in-out .95s 0.00s; }
.msg-1 { animation: wait 0.90s, msg-1 .22s 0.90s forwards; }
@keyframes msg-1 { 0% { opacity: 0; transform: translate(10px, 5px); } 100% { opacity: 1; transform: translate(10px, 0px); } }
.typing-2 { opacity: 0; animation: wait 1.15s, fade-in-out .95s 1.15s; }
.msg-2 { animation: wait 2.10s, msg-2 .22s 2.10s forwards; }
@keyframes msg-2 { 0% { opacity: 0; transform: translate(10px, 53px); } 100% { opacity: 1; transform: translate(10px, 48px); } }
.typing-3 { opacity: 0; animation: wait 2.55s, fade-in-out .95s 2.55s; }
.msg-3 { animation: wait 3.50s, msg-3 .22s 3.50s forwards; }
@keyframes msg-3 { 0% { opacity: 0; transform: translate(10px, 101px); } 100% { opacity: 1; transform: translate(10px, 96px); } }
.typing-4 { opacity: 0; animation: wait 4.25s, fade-in-out .95s 4.25s; }
.msg-4 { animation: wait 5.20s, msg-4 .22s 5.20s forwards; }
@keyframes msg-4 { 0% { opacity: 0; transform: translate(10px, 173px); } 100% { opacity: 1; transform: translate(10px, 168px); } }
