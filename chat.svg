.msg-5 { animation: wait 6.90s, msg-5 .22s 6.90s forwards; }
@keyframes msg-5 { 0% { opacity: 0; transform: translate(10px, 245px); } 100% { opacity: 1; transform: translate(10px, 240px); } }
.typing-6 { opacity: 0; animation: wait 7.85s, fade-in-out .95s 7.85s; }
.msg-6 { animation: wait 8.80s, msg-6 .22s 8.80s forwards; }
@keyframes msg-6 { 0% { opacity: 0; transform: translate(10px, 317px); } 100% { opacity: 1; transform: translate(10px, 312px); } }
.typing-7 { opacity: 0; animation: wait 9.95s, fade-in-out .95s 9.95s; }
.msg-7 { animation: wait 10.90s, msg-7 .22s 10.90s forwards; }
@keyframes msg-7 { 0% { opacity: 0; transform: translate(10px, 389px); } 100% { opacity: 1; transform: translate(10px, 384px); } }
@media (prefers-color-scheme: dark) { .bubble { fill: #3b3b3d; } text { fill: #dcdcdc; } }
@media (prefers-reduced-motion: reduce) { g[class^='msg-'] { animation: none; opacity: 1; } g[class^='typing-'] { display: none; } }</style>
<g transform="translate(10, 0)" class="typing-1">
